<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#2563EB" />
    <meta name="author" content="Nguyễn Tuấn" />

    <meta name="description" content="Thư viện SGK lớp 1-5, soạn giáo án, phiếu học tập - chạy offline local, hỗ trợ AI" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="SGK Thông Minh" />
    <title>
      Hệ thống Học tập &amp; Giảng dạy SGK thông minh - AI Primary School Portal
    </title>
    <!-- Schoolbook-friendly fonts: Andika headings, Mulish & Quicksand body,
         Be Vietnam Pro + Noto Serif for Word editor (full Vietnamese support).
         display=swap avoids invisible text when offline/slow; system fallbacks
         in CSS still render Vietnamese correctly without network. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Mulish:wght@500;600;700;800&family=Quicksand:wght@500;700&family=Be+Vietnam+Pro:wght@400;500;600;700&family=Noto+Serif:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <!-- Pre-paint theme: đọc localStorage TRƯỚC khi paint lần đầu (chống nháy tông màu
         khi app còn đang tải JS). Main.jsx sẽ apply lại đầy đủ khi mount. -->
    <script>
      try {
        var _s = JSON.parse(localStorage.getItem("sgk_settings") || "null") || {};
        var _t = (_s.appearance && _s.appearance.theme) || localStorage.getItem("sgk_theme") || "system";
        var _dark = _t === "dark" || (_t === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.setAttribute("data-theme", _dark ? "dark" : "light");
        if (_s.accessibility && _s.accessibility.highContrast) {
          document.documentElement.setAttribute("data-high-contrast", "true");
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
