    <!-- Schoolbook-friendly fonts: Andika headings, Mulish & Quicksand body,
         Be Vietnam Pro + Noto Serif for Word editor (full Vietnamese support).
         display=swap avoids invisible text when offline/slow; system fallbacks
         in CSS still render Vietnamese correctly without network. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Mulish:wght@500;600;700;800&family=Quicksand:wght@500;700&family=Be+Vietnam+Pro:wght@400;500;600;700&family=Noto+Serif:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <!-- Pre-paint theme: đọc localStorage TRƯỚC khi paint lần đầu (chống nháy tông màu
         khi app còn đang tải JS). Main.jsx sẽ apply lại đầy đủ khi mount.
         Tách ra file riêng (theme-init.js) để CSP dùng script-src 'self'
         mà không cần 'unsafe-inline'. Script cổ điển trong <head> vẫn chạy
         đồng bộ trước khi paint → không nháy màu. -->
    <script src="/theme-init.js"></script>
